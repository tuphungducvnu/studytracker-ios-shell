name: Build Remote WebView IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets and Capacitor iOS
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>App</title></head><body><h1>Loading...</h1></body></html>' > www/index.html
          fi
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r StudyTracker.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-WebView-IPA
          path: StudyTracker.ipa