name: Build Remote WebView IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets and Capacitor iOS
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>App</title></head><body><h1>Loading...</h1></body></html>' > www/index.html
          fi
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Inject Configuration & URL Schemes
        run: |
          # 1. Sao chép tệp cấu hình vào thư mục iOS native
          cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

          # 2. Đọc trực tiếp REVERSED_CLIENT_ID từ file vừa copy
          REVERSED_ID=$(plutil -extract REVERSED_CLIENT_ID raw ios/App/App/GoogleService-Info.plist)
          echo "Found Reversed Client ID: $REVERSED_ID"

          # 3. Tiêm URL Scheme vào Info.plist
          PLIST_PATH="ios/App/App/Info.plist"
          plutil -insert CFBundleURLTypes -xml "<array><dict><key>CFBundleURLSchemes</key><array><string>$REVERSED_ID</string></array></dict></array>" "$PLIST_PATH" || true

      - name: Build Unsigned App
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            BUILD_FLAG="-workspace App.xcworkspace"
          else
            BUILD_FLAG="-project App.xcodeproj"
          fi
          xcodebuild $BUILD_FLAG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r StudyTracker.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-WebView-IPA
          path: StudyTracker.ipa